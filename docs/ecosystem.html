<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MakerHub Ecosystem</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>
<div id="nav-container"></div>
<script src="loadComponents.js"></script>

<main class="page-shell">
    <section class="status-notice">
        <strong>Prototype/reference site.</strong>
        This ecosystem view uses static demo entries only and does not connect to live services.
    </section>

    <h1>MakerHub Ecosystem</h1>
    <div id="eco-list" class="reference-grid"></div>
</main>

<script src="data/competitions.js"></script>
<script src="data/exhibits.js"></script>
<script>
const container = document.getElementById("eco-list");
const items = [
    ...competitions.map(item => ({ ...item, type: "Competition" })),
    ...exhibits.map(item => ({ ...item, type: "Exhibit" }))
];

container.innerHTML = items.map(item => `
    <article>
        <p class="eyebrow">${item.type}</p>
        <h2>${item.title}</h2>
        <p>${item.description}</p>
        <p><strong>Status:</strong> ${item.status}</p>
    </article>
`).join("");
</script>
</body>
</html>
