<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>MakerHub Ecosystem</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div id="nav-container"></div>
<script src="loadComponents.js"></script>

<h1>MakerHub Ecosystem</h1>

<div id="eco-list" style="padding:20px;"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

<script>
/* =========================
   🔧 YOUR FIREBASE CONFIG
   ========================= */
const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "XXXX",
    appId: "XXXX"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* =========================
   LOAD DATA
   ========================= */
const container = document.getElementById("eco-list");

db.collection("entries")
  .get()
  .then(snapshot => {

    if (snapshot.empty) {
        container.innerHTML = "<p>No entries found.</p>";
        return;
    }

    let html = "";

    snapshot.forEach(doc => {
        const e = doc.data();

        html += `
        <div style="border:2px solid red; padding:20px; margin-bottom:20px;">
            <h2>
                <a href="detail.html?id=${doc.id}" style="color:#d4af37;">
                    ${e.title || "Untitled"}
                </a>
            </h2>

            <p>${e.description || ""}</p>

            <p><strong>Type:</strong> ${e.type || ""}</p>
            <p><strong>Level:</strong> ${e.level || ""}</p>
            <p><strong>Category:</strong> ${e.category || ""}</p>
            <p><strong>Status:</strong> ${e.status || ""}</p>
        </div>
        `;
    });

    container.innerHTML = html;

  })
  .catch(error => {
      console.error("🔥 FIREBASE ERROR:", error);

      container.innerHTML = `
        <p style="color:red;">
            Error loading data:<br>
            ${error.message}
        </p>
      `;
  });
</script>

</body>
</html>
